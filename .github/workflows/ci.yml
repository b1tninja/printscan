name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo clippy -p printscan --lib --no-default-features --locked -- -D warnings
      - run: cargo clippy -p printscan --lib --no-default-features --features serde --locked -- -D warnings
      - run: cargo clippy -p printscan --lib --no-default-features --features scan --locked -- -D warnings
      - run: cargo clippy -p printscan --lib --no-default-features --features print --locked -- -D warnings
      - run: cargo clippy -p printscan-wsd --lib --no-default-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  wasm:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p printscan --target wasm32-unknown-unknown --no-default-features --features serde,print --locked
      - run: cargo check -p printscan-wsd --target wasm32-unknown-unknown --locked
      - run: cargo check -p printscan-ipp --target wasm32-unknown-unknown --locked
