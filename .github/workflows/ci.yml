name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request makes the older run moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo clippy -p printscan --lib --no-default-features --locked -- -D warnings
      - run: cargo clippy -p printscan --lib --no-default-features --features serde --locked -- -D warnings
      - run: cargo clippy -p printscan --lib --no-default-features --features scan --locked -- -D warnings
      - run: cargo clippy -p printscan --lib --no-default-features --features print --locked -- -D warnings
      - run: cargo clippy -p printscan-wsd --lib --no-default-features --locked -- -D warnings
      - run: cargo clippy -p printscan-windows --lib --no-default-features --locked -- -D warnings
      - name: Start the print spooler (the Windows spooler tests add a temporary print-to-file printer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Start-Service Spooler
      - run: cargo test --workspace --all-features --locked
      - run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  # The oldest compiler the crates claim (`rust-version` in Cargo.toml).
  msrv:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --all-features --locked

  wasm:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p printscan --target wasm32-unknown-unknown --no-default-features --locked
      - run: cargo check -p printscan --target wasm32-unknown-unknown --no-default-features --features serde,print --locked
      - run: cargo check -p printscan-wsd --target wasm32-unknown-unknown --locked
      - run: cargo check -p printscan-ipp --target wasm32-unknown-unknown --locked

  # What crates.io would get: every crate packaged and built from its own tarball, against the
  # others' tarballs (not the workspace paths), and the portable crates' docs built for Linux as
  # docs.rs does.
  package:
    timeout-minutes: 20
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - run: cargo package --workspace --locked
      - run: cargo doc -p printscan -p printscan-wsd -p printscan-ipp --all-features --no-deps --locked --target x86_64-unknown-linux-gnu
        env:
          RUSTDOCFLAGS: -D warnings

  deny:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
