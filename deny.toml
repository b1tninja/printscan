# cargo-deny: licences, advisories, duplicate versions and sources of every dependency.
# `cargo deny check` runs in CI (.github/workflows/ci.yml).

[graph]
all-features = true

[advisories]
# Every RustSec advisory fails the check, unmaintained crates included, until it is fixed or
# listed here with a reason.
yanked = "deny"
ignore = [
    # Unmaintained, not vulnerable: a proc macro that only runs at build time, reached through
    # winprint -> fmt-derive (Windows only). No maintained release of fmt-derive drops it yet.
    { id = "RUSTSEC-2024-0370", reason = "build-time only, through winprint's fmt-derive; no upgrade exists" },
]

[licenses]
# Every licence a dependency is used under must be compatible with MIT OR Apache-2.0.
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "Zlib", "Unicode-3.0"]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own path dependencies carry a version, so they are not wildcards.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
