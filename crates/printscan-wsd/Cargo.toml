[package]
name = "printscan-wsd"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Web Services for Devices (WSD) for printers and scanners: bounded XML, SOAP 1.2 / WS-Addressing, MTOM, faults, a local-network-only URL policy, WS-Transfer, WS-Eventing and WS-Discovery messages, and a blocking HTTP transport"

[lints]
workspace = true

[dependencies]
roxmltree = { workspace = true }
thiserror = { workspace = true }

# The blocking HTTP transport. Plain http only (no TLS, no proxy, no redirects): a DeviceUrl is
# always a numeric local address. Not built for wasm32, where there is no native HTTP client.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { workspace = true }
# The WS-Print backend for the `printscan::print` registry (feature `print`) and the WS-Scan
# backend for the `printscan::scan` registry (feature `scan`).
printscan = { path = "../printscan", version = "0.1.0", default-features = false, optional = true }

[dev-dependencies]
# Lets this crate's own integration tests use the `testing` feature under a plain `cargo test`.
printscan-wsd = { path = ".", features = ["testing", "print", "scan"] }
printscan = { path = "../printscan", features = ["testing"] }

[features]
default = ["print", "scan"]
# A WS-Print backend (`printscan_wsd::print::WsdBackend`) for the `printscan::print` registry. It lists
# only printers the app adds, discovers nothing and needs consent for every job. Not on wasm32.
print = ["dep:printscan", "printscan?/print"]
# A WS-Scan backend (`printscan_wsd::scan::WsdScanBackend`) for the `printscan::scan` registry. It lists
# only scanners the app adds and discovers nothing. Not on wasm32.
scan = ["dep:printscan", "printscan?/scan"]
# A loopback HTTP server and an in-memory device for tests of clients built on this crate, and with
# `print` an in-memory WS-Print printer (`printscan_wsd::print::testing`). Never in a shipped binary.
testing = ["printscan?/testing"]
