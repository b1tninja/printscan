[package]
name = "printscan-cups"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "A CUPS print backend for printscan: the local CUPS scheduler's queues over IPP on loopback, no libcups, consent for every job"
keywords = ["cups", "ipp", "print", "printer", "printscan"]
categories = ["hardware-support", "network-programming"]
# Experimental: not published to crates.io and left out of releases (release-plz.toml) until it
# has run against a real scheduler.
publish = false

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

# The scheduler is reached over IPP with printscan-ipp's client and printscan-wsd's blocking HTTP
# transport; not built for wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
printscan = { path = "../printscan", version = "0.1.0", default-features = false, features = ["print"] }
printscan-ipp = { path = "../printscan-ipp", version = "0.1.0" }

[dev-dependencies]
printscan = { path = "../printscan", features = ["testing"] }
# The loopback HTTP server the fake scheduler in tests/fake_cups.rs answers through.
printscan-wsd = { path = "../printscan-wsd", features = ["testing"] }
